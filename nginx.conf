server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # DNS interno de Docker (el gateway se resuelve por nombre de servicio)
  resolver 127.0.0.11 valid=10s;

  # La API se pide al mismo origen que el front y nginx la reenvía al gateway
  location /api/ {
    set $gateway http://gateway:8080;
    proxy_pass $gateway;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /auth/ {
    set $gateway http://gateway:8080;
    proxy_pass $gateway;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Angular: cualquier otra ruta vuelve a index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
